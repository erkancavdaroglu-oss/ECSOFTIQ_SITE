<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayfa bulunamadı — EC SOFT</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/favicon.png">
<meta name="theme-color" content="#060b1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#060b1a;--card:#0d1838;--line:rgba(120,170,255,.14);--text:#e8eefc;--muted:#93a3c7;--cyan:#22d3ee;--blue:#2f86f0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;
background-image:radial-gradient(900px 500px at 50% -10%,rgba(47,134,240,.16),transparent 60%)}
.box{max-width:620px;text-align:center}
img.mark{width:84px;height:36px;object-fit:contain;margin-bottom:26px}
.code{font-family:Sora,sans-serif;font-size:clamp(3.4rem,12vw,6rem);font-weight:800;line-height:1;
background:linear-gradient(90deg,var(--cyan),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:Sora,sans-serif;font-size:clamp(1.3rem,4vw,1.8rem);margin:10px 0 12px}
p{color:var(--muted);line-height:1.65}
.links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
a.btn{display:inline-block;padding:12px 20px;border-radius:14px;text-decoration:none;font-weight:600;font-size:.94rem}
a.p{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#04101f}
a.g{border:1px solid var(--line);background:var(--card);color:var(--text)}
</style></head><body>
<div class="box">
  <img class="mark" src="/img/ecsoft-mark.webp" alt="EC SOFT">
  <div class="code">404</div>
  <h1>Bu sayfayı bulamadık</h1>
  <p>Aradığınız adres taşınmış ya da hiç var olmamış olabilir. Aşağıdan uygulamalarımıza ulaşabilirsiniz.</p>
  <div class="links">
    <a class="btn p" href="/">Ana sayfa</a>
    <a class="btn g" href="/#uygulamalar">Uygulamalar</a>
    <a class="btn g" href="/ehliyetiq/">EhliyetIQ</a>
    <a class="btn g" href="/#spl">SPL IQ</a>
    <a class="btn g" href="/futbolcu-takip/">Futbolcu Takip</a>
    <a class="btn g" href="mailto:info@ecsoftiq.com">info@ecsoftiq.com</a>
  </div>
</div>
</body></html>
